[pytest]
testpaths = tests
# The server modules sit at the top level (main, batching, engines, runners,
# qwen) and the tests import them by those bare names -- the same names the
# Dockerfiles COPY and the tutorials refer to. Adding the project root to
# sys.path keeps that true now that the tests live one directory down, without
# turning the server into a package and rewriting every import.
pythonpath = .

# Both of these run a real uvicorn and take minutes; neither is a grader you want
# in the edit-run loop. Deselected by default and asked for by name:
#
#   pytest                                             # the fast graders
#   RUN_E2E=1 pytest -m e2e -v                         # real weights, real HTTP
#   pytest -m bench -s                                 # serving benchmark (mock)
#
# A -m on the command line replaces the one in addopts, so `-m e2e` really does
# select only e2e rather than intersecting with the default expression.
markers =
    e2e: end-to-end against real model weights over HTTP (opt-in: RUN_E2E=1)
    bench: serving latency/throughput benchmark; prints a table, needs -s
addopts = -m "not e2e and not bench"
