apiVersion: serving.fanzhangg.dev/v1alpha1
kind: ModelServer
metadata:
  labels:
    app.kubernetes.io/name: nano-kube-llm-server
    app.kubernetes.io/managed-by: kustomize
  name: qwen-small
spec:
  # The "mock/" prefix asks for the mock engine by name. spec.model is passed
  # through as MODEL_ID, and any other value would send this image -- which
  # ships no torch -- into a real model load it cannot complete. See
  # config/samples/serving_v1alpha1_modelserver_qwen3.yaml for a real model.
  model: "mock/qwen-small"
  replicas: 2
  # Mock inference server: ~150MB, no model. Enough to exercise the whole
  # control loop -- Pending/Loading/Ready, owner refs, readiness gating,
  # queue-depth metrics -- none of which needs real weights.
  image: "modelserver-mock:latest"
