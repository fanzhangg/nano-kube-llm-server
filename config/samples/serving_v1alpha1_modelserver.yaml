apiVersion: serving.fanzhangg.dev/v1alpha1
kind: ModelServer
metadata:
  labels:
    app.kubernetes.io/name: nano-kube-llm-server
    app.kubernetes.io/managed-by: kustomize
  name: qwen-small
spec:
  # Model name, passed to the serving container as the MODEL_NAME env var
  model: "Qwen/Qwen2.5-0.5B-Instruct"
  replicas: 2
  # Mock inference server; swap for a real vLLM image once available
  image: "modelserver-mock:latest"
