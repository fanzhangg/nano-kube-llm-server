# This rule is not used by the project nano-kube-llm-server itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to serving.fanzhangg.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nano-kube-llm-server
    app.kubernetes.io/managed-by: kustomize
  name: modelserver-viewer-role
rules:
- apiGroups:
  - serving.fanzhangg.dev
  resources:
  - modelservers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - serving.fanzhangg.dev
  resources:
  - modelservers/status
  verbs:
  - get
