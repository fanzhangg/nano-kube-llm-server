# This rule is not used by the project nano-kube-llm-server itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the serving.fanzhangg.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nano-kube-llm-server
    app.kubernetes.io/managed-by: kustomize
  name: modelserver-editor-role
rules:
- apiGroups:
  - serving.fanzhangg.dev
  resources:
  - modelservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - serving.fanzhangg.dev
  resources:
  - modelservers/status
  verbs:
  - get
