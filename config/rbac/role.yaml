---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - serving.fanzhangg.dev
  resources:
  - modelservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - serving.fanzhangg.dev
  resources:
  - modelservers/finalizers
  verbs:
  - update
- apiGroups:
  - serving.fanzhangg.dev
  resources:
  - modelservers/status
  verbs:
  - get
  - patch
  - update
